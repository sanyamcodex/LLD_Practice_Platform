    <script>
      // Suppress benign reverse-proxy websocket disconnect events in sandboxed dev container
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || event.reason?.message?.includes('WebSocket'))) {
          event.preventDefault();
        }
      });
    </script>
